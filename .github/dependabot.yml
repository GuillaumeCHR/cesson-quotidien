# Alertes et mises à jour des dépendances : app Android (Gradle), backend (pip), actions GitHub.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    groups: { android: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
