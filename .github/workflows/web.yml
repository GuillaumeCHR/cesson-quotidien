# Version web de Cesson'App (dossier web/), publiée sur GitHub Pages à chaque envoi sur main qui la touche.
# La clé d'API STAR (secret STAR_CLE, facultatif) est écrite dans config.js au déploiement, jamais dans le dépôt.
name: Version web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe du JavaScript
        run: for f in web/*.js; do node --check "$f"; done
      - name: Écrire la clé STAR
        env:
          STAR_CLE: ${{ secrets.STAR_CLE }}
        run: |
          cle=$(printf '%s' "$STAR_CLE" | tr -cd 'A-Za-z0-9')
          printf 'export const STAR_CLE = "%s";\n' "$cle" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploiement
        uses: actions/deploy-pages@v4
