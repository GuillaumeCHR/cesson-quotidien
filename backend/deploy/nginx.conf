# Fichiers statiques publiés par les collecteurs. Le CDN (Cloudflare) se place devant.
server {
    listen 443 ssl http2;
    server_name donnees.example.org;  # à remplacer

    root /srv/cesson/public;
    default_type application/json;
    charset utf-8;
    gzip on;
    gzip_types application/json;

    location = /manifest.json { add_header Cache-Control "public, max-age=60"; }
    location ~ \.json$        { add_header Cache-Control "public, max-age=120"; }
    location ~ /\.            { deny all; }  # fichiers temporaires d'écriture atomique
}
