# Raspberry Pi : nginx n'écoute qu'en local. Tailscale Funnel reçoit le HTTPS public
# et relaie vers ce port (voir installer.sh). Même politique de cache que ../nginx.conf.
server {
    listen 127.0.0.1:8080;
    server_name _;

    root /srv/cesson/public;
    default_type application/json;
    charset utf-8;
    server_tokens off;  # ne pas annoncer la version de nginx
    gzip on;
    gzip_types application/json;
    access_log off;  # moins d'écritures sur la carte SD, et aucune donnée sur les utilisateurs

    # Rien à indexer : ce sont des données pour l'app. Les robots sont éconduits, sans bruit dans les journaux.
    location = /robots.txt    { access_log off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location = /favicon.ico   { access_log off; log_not_found off; return 204; }
    location = /              { return 404; }

    # add_header ne s'hérite pas quand un bloc en ajoute : les en-têtes de sécurité sont répétés.
    location = /manifest.json { add_header Cache-Control "public, max-age=60"; add_header X-Content-Type-Options nosniff always; add_header Strict-Transport-Security "max-age=31536000" always; }
    location ~ \.json$        { add_header Cache-Control "public, max-age=120"; add_header X-Content-Type-Options nosniff always; add_header Strict-Transport-Security "max-age=31536000" always; }
    location ~ /\.            { deny all; }  # fichiers temporaires d'écriture atomique

    # Tuiles OpenStreetMap de la carte de l'app, relayées et gardées en cache (voir tuiles.py, tuiles-http.conf) :
    # OpenStreetMap ne voit que le Pi, une fois par tuile. Seule l'emprise de Cesson, zooms 12 à 18, est servie.
    location ~ ^/tuiles/(?<tuile_tz>1[2-8])/(?<tuile_tx>\d+)/(?<tuile_ty>\d+)\.png$ {
        if ($tuile_dans_cesson = 0) { return 404; }
        limit_req zone=tuiles_debit burst=400 nodelay;
        proxy_cache tuiles;
        proxy_cache_key $tuile_tz/$tuile_tx/$tuile_ty;
        proxy_cache_valid 200 30d;
        proxy_cache_valid any 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "CessonApp/1.0 (+https://github.com/GuillaumeCHR/cesson-quotidien)";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_set_header X-Forwarded-For "";
        proxy_ssl_server_name on;
        proxy_ssl_name tile.openstreetmap.org;
        rewrite ^/tuiles/(.*)$ /$1 break;
        proxy_pass https://tile.openstreetmap.org;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
