    telephone: "02 99 83 52 00"
    url: https://www.ville-cesson-sevigne.fr/contacts/service-urbanisme/
    verifie_le: 2026-11-16
    espaces:
      accueil:
        nom: Accueil du public
        periodes:
          - nom: Horaires habituels
            horaires: Mo 08:30-12:00,13:00-17:15; Tu 13:00-17:15; We,Th 08:30-12:00,13:00-17:15; Fr 08:30-12:00,13:00-16:00

  police_municipale:
    nom: Police municipale
    coord: {lat: 48.11859, lon: -1.60436}  # OpenStreetMap
    adresse: Hôtel des Polices, 6 mail de Bourgchevreuil, Cesson-Sévigné
    telephone: "02 99 83 52 14"
